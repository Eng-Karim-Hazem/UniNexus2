name: uninexus
description: A Flutter login UI implementation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  cupertino_icons: ^1.0.2
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  firebase_auth: ^6.2.0
  csv: ^6.0.0
  file_saver: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images_tab/
    - assets/icons/
  fonts:
    - family: Batangas
      fonts:
        - asset: assets/fonts/Batangas.ttf
        - asset: assets/fonts/batangas-bold.otf
    - family: SpaceGrotesk
      fonts:
          - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          - asset: assets/fonts/SpaceGrotesk-Medium.ttf
            weight: 500
          - asset: assets/fonts/SpaceGrotesk-Bold.ttf
            weight: 700